name: Release

# 推送一个形如 v1.0.0 的 tag 就会触发。
#
# 这是默认的发布方式:用 ad-hoc 自签名(不需要任何 Apple 账号/密钥/Secrets 配置),
# 用户下载后首次打开会被 Gatekeeper 拦一下,需要自己去
# "系统设置 -> 隐私与安全性" 里点"仍要打开"授权一次,具体步骤 README 里有写清楚。
#
# 如果以后办了 Apple Developer Program 账号,想发不需要用户手动授权的正式签名版本,
# 用 release-notarized.yml 那个工作流(手动触发,需要先配置对应 Secrets)。

on:
  push:
    tags:
      - "v*"

# The default token is read-only in this repository unless explicitly granted
# release-write access.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build, package and sign
        run: ./build.sh

      - name: Package ZIP and DMG
        run: |
          ditto -c -k --keepParent MenuBarTranslator.app MenuBarTranslator.zip
          hdiutil create \
            -volname "MenuBar Translator" \
            -srcfolder MenuBarTranslator.app \
            -ov -format UDZO MenuBarTranslator.dmg

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MenuBarTranslator.zip
            MenuBarTranslator.dmg
          body: |
            ⚠️ 这个版本是 ad-hoc 自签名,不是 Apple 官方认证开发者签名。
            首次打开会被系统拦截提示"无法验证开发者"或"已损坏",这是正常现象,不是文件真的坏了。

            **解决方法**:双击打开被拦截后,去 **系统设置 → 隐私与安全性**,往下翻能看到一条
            关于 MenuBarTranslator 被阻止打开的提示,点 **仍要打开** 并确认,以后就能正常双击启动了。

            Release 同时提供 **DMG**（打开后拖入“应用程序”）和 **ZIP** 两种安装包。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
