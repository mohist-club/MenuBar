name: Release (Developer ID 签名 + 公证,需要付费 Apple Developer 账号)

# 这是"进阶版"发布流程,需要你自己申请 Apple Developer Program($99/年)才能用。
# 现在改成了手动触发(在仓库 Actions 页签里手动点 Run workflow),不会因为打 tag 自动跑。
#
# 日常发布默认走的是 release.yml(ad-hoc 自签名,不用付费账号,用户首次打开需要自己去
# "系统设置 -> 隐私与安全性" 里点一下"仍要打开",README 里有说明)。
# 等你办了 Developer 账号、按下面注释配好 Secrets 之后,想发一个"不需要用户手动授权"的
# 正式签名版本,再来这个页面手动触发这个工作流。
#
# 使用前需要在仓库 Settings -> Secrets and variables -> Actions 里配置这几个 secret
# (都是你自己 Apple Developer 账号相关的信息,我这边生成不了,需要你自己申请/导出):
#   APPLE_DEVELOPER_ID_CERT_P12_BASE64   Developer ID Application 证书导出的 .p12 文件, base64 编码后的内容
#   APPLE_DEVELOPER_ID_CERT_PASSWORD     导出 .p12 时设置的密码
#   APPLE_ID                             你的 Apple ID 邮箱
#   APPLE_APP_SPECIFIC_PASSWORD          在 appleid.apple.com 生成的"应用专用密码"(不是你的登录密码)
#   APPLE_TEAM_ID                        Apple Developer 账号的 Team ID(在 developer.apple.com/account 里能看到)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本号,比如 v1.0.0(需要这个 tag 已经存在)"
        required: true

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build and package
        run: ./build.sh

      - name: Sign with Developer ID
        run: |
          codesign --force --deep --options runtime \
            --sign "Developer ID Application" MenuBarTranslator.app

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent MenuBarTranslator.app MenuBarTranslator.zip
          xcrun notarytool submit MenuBarTranslator.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple MenuBarTranslator.app
          rm MenuBarTranslator.zip
          ditto -c -k --keepParent MenuBarTranslator.app MenuBarTranslator.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: MenuBarTranslator.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
